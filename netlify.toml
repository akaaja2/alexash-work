[build]
  publish = "."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Static assets: let browsers reuse them for a week and refresh in the background.
# Filenames are not versioned, so a replaced image can stay cached for up to 7 days;
# give a changed asset a new filename if it must update immediately.
# (Netlify header paths support folder wildcards but not "/*.ext", hence the explicit list.)

[[headers]]
  for = "/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

