<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Winter Press · private</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Sans:wght@400;500;700&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&display=swap">
<style>
:root{--cream:#FAF6F1;--paper:#F3EEE7;--ink:#1C1C1A;--mut:#5E5E58;--line:#DEDAD5;--rust:#9E3A24;--blue:#9CC7DD;--deep:#0E1A22}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden}
body{background:var(--cream);color:var(--ink);font:17px/1.6 'DM Sans',system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}

/* ---------- lock screen ---------- */
#lock{position:fixed;inset:0;z-index:50;background:#07090b;display:grid;place-items:center;overflow:hidden}
#lock .door{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#20262b,#3a4248 45%,#262c31);transition:transform 1.4s cubic-bezier(.7,0,.2,1)}
#lock .door.l{left:0;border-right:1px solid #0b0e10}
#lock .door.r{right:0;border-left:1px solid #0b0e10;background:linear-gradient(270deg,#20262b,#3a4248 45%,#262c31)}
#lock .seam{position:absolute;left:50%;top:0;bottom:0;width:2px;transform:translateX(-1px);background:var(--blue);box-shadow:0 0 30px 6px rgba(156,199,221,.55);animation:seam 3s ease-in-out infinite}
@keyframes seam{50%{opacity:.45}}
#lock .panel{position:relative;z-index:2;width:min(360px,calc(100vw - 40px));text-align:center;color:#E9EEF0;transition:opacity .4s}
#lock .ind{display:inline-block;font:700 34px 'Courier New',monospace;color:var(--blue);text-shadow:0 0 14px var(--blue);background:#05090c;border:1px solid rgba(156,199,221,.4);padding:6px 22px;margin-bottom:22px;letter-spacing:.1em}
#lock h1{font:500 40px/1 'Cormorant Garamond',serif;margin:0 0 6px;letter-spacing:.04em}
#lock p{margin:0 0 20px;color:#AEB6BB;font-size:14px}
#lock form{display:grid;gap:10px;background:rgba(5,9,12,.82);padding:18px;border:1px solid rgba(156,199,221,.25);border-radius:6px}
#lock label{font-size:13px;text-align:left;color:#C9D1D5}
#lock input{font:inherit;padding:12px 14px;border-radius:4px;border:1px solid #4a555c;background:#0b1013;color:#fff;min-height:46px}
#lock button{font:700 15px 'DM Sans',sans-serif;padding:12px;border:0;border-radius:999px;background:var(--rust);color:#fff;cursor:pointer;min-height:46px}
#lock .err{color:#ff9d8a;font-size:13px;min-height:18px;margin:0}
#lock.open .door.l{transform:translateX(-101%)}
#lock.open .door.r{transform:translateX(101%)}
#lock.open .panel,#lock.open .seam{opacity:0}
#lock.gone{display:none}

/* ---------- page ---------- */
.top{position:sticky;top:0;z-index:5;background:rgba(250,246,241,.93);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top .row{height:62px}
.brand{font:600 21px 'Cormorant Garamond',serif;letter-spacing:.05em}
.brand em{font:400 13px 'DM Sans',sans-serif;color:var(--mut);letter-spacing:0}
.top nav{display:flex;gap:22px;font-size:15px}.top nav a{text-decoration:none}.top nav a:hover{color:var(--rust)}
.kicker{margin:0 0 14px;font-size:12px;font-weight:700;letter-spacing:.2em;color:var(--rust)}
.kicker.light{color:var(--blue)}
h2{font:500 clamp(36px,5vw,56px)/1.04 'Cormorant Garamond',serif;margin:0 0 14px}
.sub{color:var(--mut);margin:0 0 40px;max-width:640px}

.hero{position:relative;padding:90px 0 110px;overflow:hidden}
.hero .wrap{position:relative;z-index:1}
.lift{display:inline-block;font:700 30px 'Courier New',monospace;color:var(--blue);background:var(--deep);border-radius:4px;padding:4px 18px;margin-bottom:30px;text-shadow:0 0 12px var(--blue);min-width:150px;text-align:center}
.hero-h{font:500 clamp(58px,10.5vw,120px)/.95 'Cormorant Garamond',serif;margin:0 0 34px;letter-spacing:-.01em}
.hero-h .w{display:inline-block;opacity:0;transform:translateY(40px);transition:opacity .9s,transform .9s cubic-bezier(.2,.7,.2,1)}
.hero-h .accent{color:var(--rust);font-style:italic}
.on .hero-h .w{opacity:1;transform:none}
.lede{font-size:20px;color:#3A3A36;max-width:640px;margin:0 0 18px}
.draftnote{font-size:14px;color:var(--mut);max-width:640px;border-left:3px solid var(--blue);padding-left:12px;margin:0 0 30px}
.btn{display:inline-flex;align-items:center;min-height:48px;padding:0 26px;border-radius:999px;background:var(--ink);color:var(--cream);text-decoration:none;font-weight:700}
.btn:hover{background:var(--rust)}
.fog{position:absolute;inset:-20% -40%;background:radial-gradient(ellipse at 30% 50%,rgba(156,199,221,.22),transparent 55%),radial-gradient(ellipse at 70% 60%,rgba(158,58,36,.08),transparent 50%);animation:drift 26s linear infinite alternate;pointer-events:none}
.fog.f2{animation-duration:38s;animation-direction:alternate-reverse;opacity:.7}
@keyframes drift{to{transform:translateX(18%)}}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}

.stories{background:var(--paper);padding:100px 0}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column;transition:transform .35s,box-shadow .35s}
.card:hover,.card:focus-visible{transform:translateY(-6px) rotate(-.4deg);box-shadow:0 24px 40px -18px rgba(28,28,26,.35)}
.card:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
.card h3{font:500 32px/1.05 'Cormorant Garamond',serif;margin:6px 22px 8px}
.card p{margin:0 22px 18px;color:#3A3A36;font-size:15.5px;line-height:1.55}
.card .note{color:var(--rust);font-size:13px;margin-top:-6px}
.meta{display:flex;justify-content:space-between;margin:16px 22px 0;font-size:11.5px;letter-spacing:.14em;color:var(--mut);font-weight:700}
.art{height:190px;position:relative;overflow:hidden;background:var(--deep)}

/* audit */
.art-audit{background:linear-gradient(#2a2620,#14110e)}
.art-audit .doors{position:absolute;left:50%;top:26px;width:110px;height:150px;transform:translateX(-50%);display:flex;gap:2px;background:var(--blue);box-shadow:0 0 22px rgba(156,199,221,.5)}
.art-audit .doors i{flex:1;background:linear-gradient(90deg,#3d454b,#5d666c,#3d454b);animation:doors 6s ease-in-out infinite}
.art-audit .doors i:first-child{transform-origin:left}.art-audit .doors i:last-child{transform-origin:right}
@keyframes doors{0%,15%,85%,100%{transform:scaleX(1)}35%,65%{transform:scaleX(.18)}}
.art-audit .owed{position:absolute;top:6px;left:50%;transform:translateX(-50%);font:700 13px 'Courier New',monospace;color:var(--blue);text-shadow:0 0 8px var(--blue);letter-spacing:.1em}
.art-audit .owed b{display:inline-block;animation:count 6s steps(1) infinite}
@keyframes count{0%{opacity:1}50%{opacity:.2}55%{opacity:1}}
/* arrow */
.art-arrow{background:linear-gradient(#cfd8dc,#a7b5a0)}
.art-arrow .streak{position:absolute;left:-40%;top:58%;width:42%;height:3px;background:linear-gradient(90deg,transparent,#fff 70%,#1c1c1a);transform:rotate(-14deg);animation:fly 3.2s cubic-bezier(.6,0,.4,1) infinite}
.art-arrow .streak::after{content:"";position:absolute;right:-8px;top:-5px;border:6px solid transparent;border-left:10px solid var(--ink)}
@keyframes fly{0%{left:-45%}60%,100%{left:120%}}
.art-arrow .crow{position:absolute;left:62%;top:22%;width:34px;height:10px;border-radius:50%;background:var(--ink);box-shadow:-14px -6px 0 -2px var(--ink),14px -6px 0 -2px var(--ink);animation:hover 4s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-4px)}}
.art-arrow .cab{position:absolute;width:20px;height:20px;border-radius:50%;background:#6f8f4a;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18);animation:bounce 2.4s ease-in-out infinite}
.art-arrow .c1{left:16%;bottom:16%}.art-arrow .c2{left:30%;bottom:10%;animation-delay:.4s}.art-arrow .c3{left:44%;bottom:6%;animation-delay:.8s}
@keyframes bounce{50%{transform:translateY(-22px) rotate(90deg)}}
/* carriage */
.art-carriage{background:linear-gradient(#0b1520,#1a2833)}
.art-carriage .moon{position:absolute;right:18%;top:18px;width:46px;height:46px;border-radius:50%;background:#bcd8e8;box-shadow:0 0 30px #9CC7DD}
.art-carriage .road{position:absolute;left:50%;bottom:-10px;width:140px;height:130px;transform:translateX(-50%) perspective(120px) rotateX(48deg);background:#2b3136}
.art-carriage .lights{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);display:flex;gap:14px;animation:recede 5s ease-in infinite}
.art-carriage .lights i{width:7px;height:7px;border-radius:50%;background:#e2553a;box-shadow:0 0 10px #e2553a}
@keyframes recede{0%{transform:translateX(-50%) scale(1.4);opacity:1}100%{transform:translateX(-50%) translateY(-60px) scale(.3);opacity:0}}
.art-carriage .mist{position:absolute;inset:0;background:linear-gradient(transparent 30%,rgba(200,215,225,.35) 70%,rgba(200,215,225,.15));animation:drift 9s ease-in-out infinite alternate}
/* strange */
.art-strange{background:linear-gradient(#384047,#6b6a5f)}
.art-strange .hill{position:absolute;left:-10%;right:-10%;bottom:-60px;height:150px;border-radius:50% 50% 0 0;background:#3b4136}
.art-strange .rings{position:absolute;left:50%;top:70px}
.art-strange .rings i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border:2px solid var(--blue);border-radius:50%;animation:ring 3s ease-out infinite}
.art-strange .rings i:nth-child(2){animation-delay:1s}.art-strange .rings i:nth-child(3){animation-delay:2s}
@keyframes ring{to{transform:scale(7);opacity:0}}
.art-strange .grass{position:absolute;left:0;right:0;bottom:0;height:60px;background:repeating-linear-gradient(80deg,transparent 0 6px,rgba(170,170,120,.45) 6px 8px);transform-origin:bottom;animation:lean 3s ease-in-out infinite}
@keyframes lean{50%{transform:skewX(-8deg)}}
/* water */
.art-water{background:linear-gradient(#0b2230,#020a10)}
.art-water .glow{position:absolute;left:50%;top:62%;width:120px;height:80px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(#9CC7DD,rgba(156,199,221,0) 70%);animation:sing 4s ease-in-out infinite}
@keyframes sing{50%{transform:translate(-50%,-50%) scale(1.5);opacity:.6}}
.art-water .wave{position:absolute;left:-50%;width:200%;height:14px;top:16px;background:repeating-radial-gradient(circle at 10px -4px,transparent 0 9px,rgba(156,199,221,.35) 9px 11px);background-size:22px 14px;animation:waves 6s linear infinite}
.art-water .w2{top:24px;opacity:.5;animation-duration:9s}
@keyframes waves{to{transform:translateX(22%)}}
.art-water .boat{position:absolute;left:30%;top:6px;width:30px;height:8px;background:var(--ink);border-radius:0 0 10px 10px;animation:hover 3s ease-in-out infinite}
/* sofa */
.art-sofa{background:linear-gradient(#3a2a1d,#1e1610)}
.art-sofa .sofa{position:absolute;left:12%;right:12%;bottom:34px;height:70px;border-radius:14px 14px 6px 6px;background:#6a5442}
.art-sofa .cush{position:absolute;bottom:80px;width:56px;height:52px;border-radius:8px;background:repeating-linear-gradient(0deg,#a33a2a 0 8px,#c7533e 8px 16px),#a33a2a;background-blend-mode:multiply;transform-origin:bottom center}
.art-sofa .k1{left:30%;animation:plot 3s ease-in-out infinite}.art-sofa .k2{left:50%;animation:plot 3s ease-in-out infinite reverse}
@keyframes plot{50%{transform:rotate(9deg)}}
.art-sofa .cat{position:absolute;right:10%;bottom:8px;width:54px;height:40px;border-radius:50% 50% 40% 40%;background:#f1ece4}
.art-sofa .cat i{position:absolute;top:13px;width:9px;height:3px;background:#3d6b4a;border-radius:2px;animation:squint 4s infinite}
.art-sofa .cat i:first-child{left:12px}.art-sofa .cat i:last-child{right:12px}
@keyframes squint{0%,80%,100%{height:3px}88%{height:1px}}

.why{background:var(--ink);color:var(--cream);padding:100px 0}
.why h2 em{color:var(--blue)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:40px;margin-top:40px}
.three .num{font:500 46px 'Cormorant Garamond',serif;color:var(--blue)}
.three h3{margin:6px 0 8px;font-size:19px}.three p{margin:0;color:#C5C1B9}
.comps{margin:60px 0 0;padding-top:20px;border-top:1px solid #3d3d3a;color:#C5C1B9}

.decide{padding:100px 0}
.two{display:grid;grid-template-columns:1fr 1.2fr;gap:56px}
.decide ol{margin:0;padding-left:22px;display:grid;gap:12px;font-size:16.5px}
.decide li::marker{color:var(--rust);font-weight:700}
.foot{background:var(--ink);color:#B9B4AD;padding:34px 0;font-size:14px}

@media (max-width:860px){.grid{grid-template-columns:1fr 1fr}.three,.two{grid-template-columns:1fr}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.top nav{display:none}.hero{padding:60px 0 80px}}

/* ---------- e-reader ---------- */
#reader{position:fixed;inset:0;z-index:40;background:rgba(14,12,10,.86);display:none;align-items:center;justify-content:center;padding:20px}
#reader.show{display:flex;animation:fadein .35s}
@keyframes fadein{from{opacity:0}}
.device{position:relative;background:#1f1f1d;border-radius:28px;padding:22px 22px 54px;box-shadow:0 40px 80px -20px #000,inset 0 0 0 2px #333;width:min(980px,96vw);height:min(760px,92vh);display:flex;flex-direction:column;animation:rise .5s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{transform:translateY(40px) scale(.96)}}
.device::after{content:"";position:absolute;left:50%;bottom:18px;width:44px;height:16px;transform:translateX(-50%);border-radius:8px;border:2px solid #3c3c39}
.screen{position:relative;flex:1;background:#F2EFE7;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;color:#222}
.rbar{display:flex;justify-content:space-between;align-items:center;padding:10px 18px;font:12px 'DM Sans',sans-serif;color:#6b6860;border-bottom:1px solid #e0dbd0;gap:10px}
.rbar .t{font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbar .ctl{display:flex;gap:6px;align-items:center}
.rbar button{all:unset;cursor:pointer;min-width:34px;height:34px;display:grid;place-items:center;border-radius:6px;font-weight:700;color:#3a3832}
.rbar button:hover,.rbar button:focus-visible{background:#e4dfd3}
.pagewrap{position:relative;flex:1;overflow:hidden;margin:26px 30px 10px;perspective:2200px}
.flow{height:100%;column-fill:auto;font-family:'Literata',Georgia,serif;font-size:var(--fs,17px);line-height:1.6;text-align:justify;hyphens:auto;transition:transform .55s cubic-bezier(.6,.05,.3,1)}
.flow p{margin:0 0 .8em}
.flow .cover{break-after:column;height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center;border:1px solid #d8d2c4;padding:20px}
.flow .cover small{letter-spacing:.24em;font:700 11px 'DM Sans',sans-serif;color:#9E3A24}
.flow .cover h1{font:500 2.6em/1 'Cormorant Garamond',serif;margin:.4em 0 .3em;text-align:center}
.flow .cover .by{font-style:italic;color:#555}
.flow .cover .cn{font:12px 'DM Sans',sans-serif;color:#9E3A24;margin-top:1.4em}
.flow .end{text-align:center;letter-spacing:.3em;color:#888;margin-top:1.5em}
.leaf{position:absolute;top:0;bottom:0;width:50%;right:0;transform-origin:left center;background:linear-gradient(90deg,#e9e4d8,#F2EFE7 30%,#F2EFE7);box-shadow:0 0 30px rgba(0,0,0,.25);backface-visibility:hidden;display:none;z-index:3}
.leaf.single{width:100%}
.leaf.go{display:block;animation:turn .6s cubic-bezier(.5,.05,.4,1) forwards}
.leaf.back{display:block;left:0;right:auto;transform-origin:right center;animation:turnb .6s cubic-bezier(.5,.05,.4,1) forwards}
@keyframes turn{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes turnb{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.spine{position:absolute;top:0;bottom:0;left:50%;width:30px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(0,0,0,.07),transparent);pointer-events:none;z-index:2}
.rfoot{display:flex;align-items:center;gap:14px;padding:8px 18px 12px;font:12px 'DM Sans',sans-serif;color:#6b6860}
.prog{flex:1;height:4px;background:#e0dbd0;border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:#9E3A24;width:0;transition:width .4s}
.nav{position:absolute;top:50%;transform:translateY(-50%);z-index:5;all:unset;cursor:pointer;width:48px;height:48px;border-radius:50%;background:rgba(31,31,29,.85);color:#fff;display:grid;place-items:center;font-size:22px}
.navp{position:absolute;left:-12px;top:50%;transform:translateY(-50%)}.navn{position:absolute;right:-12px;top:50%;transform:translateY(-50%)}
@media (max-width:700px){.device{padding:12px 10px 40px;border-radius:20px;height:94vh}.pagewrap{margin:18px 18px 8px}.spine{display:none}.navp,.navn{top:auto;bottom:2px;transform:none;width:40px;height:40px;font-size:18px}.navp{left:14px}.navn{right:14px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal,.hero-h .w{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="lock">
  <div class="door l"></div><div class="door r"></div><div class="seam"></div>
  <div class="panel">
    <div class="ind">B</div>
    <h1>WINTER PRESS</h1>
    <p>Private working page. Enter the password to open the doors.</p>
    <form id="lf">
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" required autofocus>
      <p class="err" id="err" role="alert"></p>
      <button type="submit">Open</button>
    </form>
  </div>
</div>

<main id="app" aria-live="polite"></main>

<div id="reader" role="dialog" aria-modal="true" aria-label="E-reader">
  <div class="device">
    <div class="screen">
      <div class="rbar"><span class="t" id="rt"></span><span class="ctl">
        <button id="fsm" aria-label="Smaller text">A−</button><button id="fsp" aria-label="Larger text">A+</button><button id="rx" aria-label="Close reader">✕</button></span></div>
      <div class="pagewrap" id="pw2"><div class="flow" id="flow"></div><div class="spine" id="spine"></div><div class="leaf" id="leaf"></div></div>
      <div class="rfoot"><span id="pg">1 / 1</span><div class="prog"><i id="pbar"></i></div><span id="left"></span></div>
    </div>
    <button class="nav navp" id="prev" aria-label="Previous page">‹</button>
    <button class="nav navn" id="next" aria-label="Next page">›</button>
  </div>

const ITER = 400000;
(() => {
  const $ = (s) => document.getElementById(s);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let DATA = null;

  async function decrypt(pass) {
    const raw = b64(PAYLOAD), salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    return JSON.parse(new TextDecoder().decode(pt));
  }

  async function unlock(pass, remember) {
    try {
      DATA = await decrypt(pass);
    } catch (e) { return false; }
    if (remember) { try { sessionStorage.setItem("wp-pass", pass); } catch (e) {} }
    $("app").innerHTML = DATA.main;
    start();
    const lock = $("lock");
    lock.classList.add("open");
    setTimeout(() => lock.classList.add("gone"), 1500);
    return true;
  }

  $("lf").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").textContent = "Checking…";
    const ok = await unlock($("pw").value, true);
    if (!ok) { $("err").textContent = "That password didn't open the doors."; $("pw").select(); }
  });
  try { const s = sessionStorage.getItem("wp-pass"); if (s) unlock(s, false); } catch (e) {}

  // ---------- page animations ----------
  function start() {
    requestAnimationFrame(() => document.body.classList.add("on"));
    document.querySelectorAll(".hero-h .w").forEach((w, i) => (w.style.transitionDelay = 0.25 + i * 0.18 + "s"));
    const io = new IntersectionObserver((es) => es.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.12 });
    document.querySelectorAll(".reveal").forEach((el, i) => { el.style.transitionDelay = (i % 3) * 0.08 + "s"; io.observe(el); });
    const seq = ["G", "7", "6", "5", "4", "3", "2", "1", "B", "OWED 4"];
    let k = 0; const fl = document.getElementById("floor");
    const tick = () => { if (!fl) return; fl.textContent = seq[k]; k++; if (k < seq.length) setTimeout(tick, k === seq.length - 1 ? 900 : 420); };
    setTimeout(tick, 600);
    document.querySelectorAll(".mins").forEach((m) => { const s = DATA.stories[m.dataset.words]; if (s) m.textContent = Math.max(1, Math.round(s.words / 230)) + " MIN READ"; });
    document.querySelectorAll(".card").forEach((c) => c.addEventListener("click", () => openReader(c.dataset.story, c)));
  }

  // ---------- e-reader ----------
  let page = 0, pages = 1, step = 1, fs = 17, current = null, opener = null, busy = false;
  const flow = $("flow"), wrapEl = $("pw2"), leaf = $("leaf");

  function layout() {
    const w = wrapEl.clientWidth, h = wrapEl.clientHeight, spread = w > 720;
    const gap = spread ? 60 : 40;
    const colW = spread ? (w - gap) / 2 : w;
    step = spread ? 2 : 1;
    flow.style.columnWidth = colW + "px"; flow.style.columnGap = gap + "px"; flow.style.height = h + "px";
    flow.style.setProperty("--fs", fs + "px");
    $("spine").style.display = spread ? "" : "none";
    leaf.classList.toggle("single", !spread);
    flow._unit = colW + gap;
    pages = Math.max(1, Math.round((flow.scrollWidth + gap) / flow._unit));
    page = Math.min(page, pages - 1); page -= page % step;
    show(false);
  }
  function show() {
    flow.style.transform = `translateX(${-page * flow._unit}px)`;
    const last = Math.min(pages, page + step);
    $("pg").textContent = (step === 2 && last > page + 1 ? `${page + 1}–${last}` : `${page + 1}`) + " / " + pages;
    $("pbar").style.width = (last / pages) * 100 + "%";
    const s = DATA.stories[current]; const remain = Math.round((s.words * (1 - last / pages)) / 230);
    $("left").textContent = remain > 0 ? remain + " min left" : "The end";
  }
  function turn(dir) {
    const np = page + dir * step;
    if (busy || np < 0 || np >= pages) return;
    busy = true;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    leaf.className = "leaf" + (step === 1 ? " single" : "") + (reduce ? "" : dir > 0 ? " go" : " back");
    setTimeout(() => { page = np; show(); }, reduce ? 0 : 280);
    setTimeout(() => { leaf.className = "leaf" + (step === 1 ? " single" : ""); busy = false; }, reduce ? 0 : 620);
  }
  function openReader(id, btn) {
    const s = DATA.stories[id]; if (!s) return;
    current = id; opener = btn; page = 0;
    $("rt").textContent = s.title;
    flow.innerHTML = `<div class="cover"><small>${s.tag}</small><h1>${s.title}</h1><div class="by">James Allen</div><div class="by" style="margin-top:.4em;font-size:.85em">from Final Clearance</div>${s.note ? `<div class="cn">${s.note}</div>` : ""}</div>` + s.html + `<p class="end">❧ THE END ❧</p>`;
    $("reader").classList.add("show");
    document.body.style.overflow = "hidden";
    requestAnimationFrame(() => { layout(); $("next").focus(); });
  }
  function closeReader() { $("reader").classList.remove("show"); document.body.style.overflow = ""; opener?.focus(); }
  $("next").addEventListener("click", () => turn(1));
  $("prev").addEventListener("click", () => turn(-1));
  $("rx").addEventListener("click", closeReader);
  $("fsp").addEventListener("click", () => { fs = Math.min(24, fs + 1); const r = page / pages; layout(); page = Math.round(r * pages); page -= page % step; show(); });
  $("fsm").addEventListener("click", () => { fs = Math.max(14, fs - 1); const r = page / pages; layout(); page = Math.round(r * pages); page -= page % step; show(); });
  $("reader").addEventListener("click", (e) => { if (e.target.id === "reader") closeReader(); });
  addEventListener("keydown", (e) => {
    if (!$("reader").classList.contains("show")) return;
    if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); turn(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); turn(-1); }
    else if (e.key === "Escape") closeReader();
  });
  let sx = null;
  wrapEl.addEventListener("touchstart", (e) => (sx = e.touches[0].clientX), { passive: true });
  wrapEl.addEventListener("touchend", (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 40) turn(dx < 0 ? 1 : -1); sx = null; });
  addEventListener("resize", () => { if ($("reader").classList.contains("show")) layout(); });
})();
</script>
</body>
</html>
